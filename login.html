
<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>เข้าสู่ระบบ | เที่ยวบ้านเรา</title>
  <link rel="stylesheet" href="style.css">

  <style>
    .login-page {
      min-height: 650px;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 40px 20px;
    }

    .login-box {
      width: 100%;
      max-width: 420px;
      padding: 45px 40px;
      box-sizing: border-box;
      background: white;
      border: 1px solid #e5e5e5;
      border-radius: 20px;
      box-shadow: 0 10px 35px rgba(0,0,0,0.08);
    }

    .login-symbol {
      text-align: center;
      font-size: 45px;
      margin-bottom: 10px;
    }

    .login-box h1 {
      text-align: center;
      margin-bottom: 10px;
    }

    .login-desc {
      text-align: center;
      color: #888;
      margin-bottom: 30px;
      line-height: 1.7;
    }

    .login-box label {
      display: block;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .login-box input {
      width: 100%;
      box-sizing: border-box;
      padding: 14px;
      border: 1px solid #ddd;
      border-radius: 9px;
      margin-bottom: 22px;
      font-size: 15px;
      outline: none;
    }

    .login-box input:focus {
      border-color: #8b735b;
    }

    .login-btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 9px;
      background: #66503d;
      color: white;
      font-size: 17px;
      cursor: pointer;
    }

    .login-btn:hover {
      background: #463628;
    }

    .back-home {
      display: block;
      text-align: center;
      margin-top: 25px;
      text-decoration: none;
    }

    .login-footer {
      text-align: center;
      color: #aaa;
      font-size: 12px;
      margin-top: 30px;
    }

    @media(max-width: 500px) {
      .login-box {
        padding: 30px 22px;
      }
    }
  </style>
</head>

<body>

  <header>
    <p class="site-name">เที่ยวบ้านเรา</p>

    <nav aria-label="เมนูหลัก">
      <ul>
        <li><a href="index.html">หน้าแรก</a></li>
        <li><a href="places.html">ที่เที่ยว</a></li>
        <li><a href="food.html">อาหาร</a></li>
        <li><a href="plan.html">วางแผนเที่ยว</a></li>
        <li><a href="travel.html">ข้อมูลการเดินทาง</a></li>
        <li><a href="login.html">เข้าสู่ระบบ</a></li>
      </ul>
    </nav>
  </header>

  <main class="login-page">

    <div class="login-box">

      <div class="login-symbol">✦</div>

      <h1>เข้าสู่ระบบ</h1>

      <p class="login-desc">
        ยินดีต้อนรับสู่เว็บไซต์เที่ยวบ้านเรา
        เริ่มต้นการเดินทางไปพร้อมกัน
      </p>

      <form onsubmit="loginUser(event)">

        <label for="username">ชื่อผู้ใช้งาน</label>
        <input
          type="text"
          id="username"
          placeholder="กรอกชื่อผู้ใช้งาน"
          required
        >

        <label for="password">รหัสผ่าน</label>
        <input
          type="password"
          id="password"
          placeholder="กรอกรหัสผ่าน"
          required
        >

        <button type="submit" class="login-btn">
          เข้าสู่ระบบ
        </button>

      </form>

      <a href="index.html" class="back-home">
        ← กลับหน้าหลัก
      </a>

      <p class="login-footer">
        เที่ยวบ้านเรา | ทุกการเดินทางมีเรื่องราว
      </p>

    </div>

  </main>

  

  <script>
    function loginUser(event) {
      event.preventDefault();

      window.location.href = "index.html";
    }
  </script>

</body>
</html>
